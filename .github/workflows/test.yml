name: Patch LK Image with Cert Bypass

on:
  workflow_dispatch:
    inputs:
      lk_img_url:
        description: 'URL of the LK image to patch (required)'
        required: true
        type: string
      output_name:
        description: 'Name for the patched image file'
        required: false
        default: 'patched_lk.img'
        type: string
      bypass_mode:
        description: 'Certificate bypass mode'
        required: false
        default: 'override'
        type: choice
        options:
          - override
          - wrap

jobs:
  patch-lk:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install lkpatcher
        run: |
          pip install --upgrade pip
          pip install git+https://github.com/R0rt1z2/lkpatcher

      - name: Download LK image
        run: |
          curl -L -o lk.img "${{ inputs.lk_img_url }}"

      - name: Apply certificate bypass
        run: |
          python -m lkpatcher lk.img \
            -o "${{ inputs.output_name }}" \
            --cert-bypass ${{ inputs.bypass_mode }}

      - name: Upload patched image
        uses: actions/upload-artifact@v4
        with:
          name: patched-lk
          path: ${{ inputs.output_name }}
